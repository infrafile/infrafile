name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm install --global npm@11.21.1
      - run: make check build
      - run: npx --prefix web playwright install --with-deps chromium webkit
      - run: INFRAFILE_BROWSER_ENGINE=chromium make browser-test
      - run: INFRAFILE_BROWSER_ENGINE=webkit make browser-test
