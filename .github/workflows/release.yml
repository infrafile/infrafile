name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm install --global npm@11.21.1
      - run: make check build
      - run: bash scripts/smoke.sh bin/infrafile examples/homelab
      - uses: sigstore/cosign-installer@v4.1.0
        with:
          cosign-release: v3.1.4
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: v2.19.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Test the packaged Linux archive
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          extracted="$(mktemp -d)"
          tar -xzf "dist/infrafile_${RELEASE_TAG#v}_linux_amd64.tar.gz" -C "$extracted"
          test -s "$extracted/docs/quickstart.md"
          python3 "$extracted/scripts/prepare_agent_acceptance.py" --help
          bash "$extracted/scripts/smoke.sh" "$extracted/infrafile" "$extracted/examples/homelab"
      - name: Generate, sign and attach the formula to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 scripts/homebrew.py "$RELEASE_TAG" dist/checksums.txt > dist/infrafile.rb
          cosign sign-blob --yes --bundle dist/infrafile.rb.sigstore.json dist/infrafile.rb
          gh release upload "$RELEASE_TAG" dist/infrafile.rb dist/infrafile.rb.sigstore.json
